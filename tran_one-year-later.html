<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>一年後</title>
    <link rel="stylesheet" href="./assets/css/styles.css" />
    <style>
      .story-transition-page .story-shell {
        min-height: 100vh;
      }

      .transition-plain {
        display: flex;
        min-height: 100vh;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 32px;
        padding: 48px 24px;
      }

      .transition-line {
        margin: 0;
        min-height: 3.8em;
        max-width: 16em;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        font-size: clamp(2rem, 4.5vw, 3.5rem);
        line-height: 1.75;
        letter-spacing: 0.06em;
        font-weight: 500;
        color: inherit;
        text-wrap: balance;
      }

      .transition-caret {
        display: inline-block;
        width: 0.08em;
        height: 0.9em;
        margin-left: 0.14em;
        background: currentColor;
        vertical-align: -0.08em;
        animation: transition-caret-blink 0.9s steps(1, end) infinite;
      }

      .anniversary-button {
        position: relative;
        display: none;
        align-items: center;
        gap: 16px;
        width: min(88vw, 460px);
        padding: 20px 28px;
        border: 0;
        border-radius: 28px;
        background: linear-gradient(135deg, rgba(255,255,255,0.98) 0%, rgba(255,244,238,0.98) 100%);
        box-shadow: 0 26px 84px rgba(112, 72, 40, 0.2);
        transform: translateY(16px) scale(0.96);
        opacity: 0;
        cursor: pointer;
        overflow: hidden;
      }

      .anniversary-button.is-visible {
        display: inline-flex;
        animation: bubble-rise 0.65s cubic-bezier(0.2, 0.9, 0.2, 1) forwards;
      }

      .anniversary-button::before,
      .anniversary-button::after {
        content: '';
        position: absolute;
        inset: auto;
        border-radius: 999px;
        opacity: 0.6;
        pointer-events: none;
      }

      .anniversary-button::before {
        width: 18px;
        height: 18px;
        top: 14px;
        right: 18px;
        background: #ffd166;
        animation: float-spark 2.2s ease-in-out infinite;
      }

      .anniversary-button::after {
        width: 10px;
        height: 10px;
        bottom: 18px;
        left: 20px;
        background: #7bdff2;
        animation: float-spark 2.4s ease-in-out 0.35s infinite;
      }

      .anniversary-mascot {
        width: 62px;
        height: 62px;
        object-fit: contain;
        flex: 0 0 auto;
        animation: mascot-bob 2.4s ease-in-out infinite;
      }

      .anniversary-copy strong {
        display: block;
        color: #db0011;
        font-size: clamp(1.1rem, 2.6vw, 1.45rem);
        line-height: 1.35;
        letter-spacing: 0.04em;
      }

      .anniversary-copy span {
        display: inline-flex;
        margin-top: 10px;
        padding: 9px 16px;
        border-radius: 999px;
        background: rgba(219, 0, 17, 0.1);
        color: #db0011;
        font-size: 0.95rem;
        font-weight: 700;
      }

      @keyframes transition-caret-blink {
        0%, 49% {
          opacity: 1;
        }

        50%, 100% {
          opacity: 0;
        }
      }

      @keyframes bubble-rise {
        from {
          opacity: 0;
          transform: translateY(16px) scale(0.96);
        }

        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      @keyframes mascot-bob {
        0%, 100% {
          transform: translateY(0) rotate(-2deg);
        }

        50% {
          transform: translateY(-5px) rotate(2deg);
        }
      }

      @keyframes float-spark {
        0%, 100% {
          transform: translateY(0) scale(1);
          opacity: 0.55;
        }

        50% {
          transform: translateY(-7px) scale(1.1);
          opacity: 0.9;
        }
      }
    </style>
  </head>
  <body class="story-page story-transition-page" data-page-id="story-one-year-later" data-page-title="一年後">
    <div class="story-shell story-shell-centered">
      <section class="story-plain transition-plain" aria-label="One year later transition">
        <h1 class="transition-line" id="transitionLine" aria-live="polite"></h1>
        <button class="anniversary-button" id="anniversaryButton" type="button" aria-label="點擊參加一週年晚宴">
          <img class="anniversary-mascot" src="./assets/media/icons/chiikawa_icon.png" alt="Mascot" />
          <div class="anniversary-copy">
            <strong>拉王（中國）成立一週年晚宴</strong>
            <span>點擊參加</span>
          </div>
        </button>
      </section>
    </div>
    <script src="./assets/js/story-transition.js"></script>
    <script>
      (function () {
        var lineNode = document.getElementById('transitionLine');
        var buttonNode = document.getElementById('anniversaryButton');
        var storyTransition = window.HSBCStoryTransition;
        var lineText = '一年後。。。';
        var lineReady = false;
        var buttonShown = false;

        function renderLine() {
          if (!storyTransition) {
            return;
          }

          var lineParts = storyTransition.ensureLineStructure(lineNode, 'transition-caret');

          storyTransition.typeCharacters(lineParts.textNode, lineText, 90, function () {
            lineReady = true;
          });
        }

        function revealButton() {
          if (!lineReady || buttonShown) {
            return;
          }

          buttonShown = true;
          buttonNode.classList.add('is-visible');
        }

        if (storyTransition) {
          storyTransition.bindAdvanceTriggers({
            guardNode: buttonNode,
            onAdvance: revealButton
          });
        }

        buttonNode.addEventListener('click', function () {
          if (!buttonShown) {
            return;
          }

          window.location.href = './vid_v4.html';
        });

        renderLine();
      }());
    </script>
    <script defer src="./assets/js/presenter-display.js"></script>
  </body>
</html>
