<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>故事完結</title>
    <link rel="stylesheet" href="./assets/css/styles.css" />
    <style>
      .story-typing-page .story-shell {
        min-height: 100vh;
      }

      .story-typing-page .story-plain {
        display: flex;
        min-height: 100vh;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        padding: 48px 24px;
        text-align: center;
      }

      .typing-line {
        margin: 0;
        min-height: 3.8em;
        max-width: 18em;
        text-align: center;
        font-size: clamp(2rem, 4.5vw, 3.5rem);
        line-height: 1.75;
        letter-spacing: 0.06em;
        font-weight: 500;
        color: inherit;
        text-wrap: balance;
      }

      .typing-copy {
        margin: 0;
        min-height: 4.8em;
        max-width: 36rem;
        font-size: clamp(1.05rem, 1.8vw, 1.35rem);
        line-height: 1.9;
        letter-spacing: 0.03em;
        color: rgba(255, 255, 255, 0.88);
      }

      .typing-caret {
        display: inline-block;
        width: 0.08em;
        height: 0.9em;
        margin-left: 0.14em;
        background: currentColor;
        vertical-align: -0.08em;
        animation: typing-caret-blink 0.9s steps(1, end) infinite;
      }

      @keyframes typing-caret-blink {
        0%, 49% {
          opacity: 1;
        }

        50%, 100% {
          opacity: 0;
        }
      }
    </style>
  </head>
  <body class="story-page story-typing-page" data-page-id="story-ending" data-page-title="故事完結">
    <div class="story-shell">
      <section class="story-plain" aria-label="Ending page">
        <h1 class="typing-line" id="typingLine" aria-live="polite"></h1>
        <p class="typing-copy" id="typingCopy" aria-live="polite"></p>
      </section>
    </div>
    <script>
      (function () {
        var lineNode = document.getElementById('typingLine');
        var copyNode = document.getElementById('typingCopy');
        var lineText = '從此小白過上無憂無慮的生活。。。';
        var copyText = '由創業起步、成功開戶，到管理匯率風險及規劃拓展，小白終於有更多時間專注做好生意，也對未來更有把握。';
        var lineIndex = 0;
        var copyIndex = 0;

        function renderCopy() {
          if (copyIndex < copyText.length) {
            copyNode.textContent += copyText.charAt(copyIndex);
            copyIndex += 1;
            window.setTimeout(renderCopy, 34);
            return;
          }

          copyNode.innerHTML = copyNode.textContent + '<span class="typing-caret" aria-hidden="true"></span>';
        }

        function renderLine() {
          if (lineIndex < lineText.length) {
            lineNode.textContent += lineText.charAt(lineIndex);
            lineIndex += 1;
            window.setTimeout(renderLine, 78);
            return;
          }

          lineNode.innerHTML = lineNode.textContent + '<span class="typing-caret" aria-hidden="true"></span>';
          window.setTimeout(renderCopy, 220);
        }

        renderLine();
      }());
    </script>
    <script defer src="./assets/js/presenter-display.js"></script>
  </body>
</html>
