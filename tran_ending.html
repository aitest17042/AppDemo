<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>故事完結</title>
    <link rel="stylesheet" href="./assets/css/styles.css" />
    <style>
      .story-typing-page .story-shell {
        min-height: 100vh;
      }

      .story-typing-page .story-plain {
        display: flex;
        min-height: 100vh;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        padding: 48px 24px;
        text-align: center;
      }

      .typing-line {
        margin: 0;
        min-height: 3.8em;
        max-width: 18em;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        font-size: clamp(2rem, 4.5vw, 3.5rem);
        line-height: 1.75;
        letter-spacing: 0.06em;
        font-weight: 500;
        color: inherit;
        text-wrap: balance;
      }

      .typing-line-image {
        width: min(220px, 48vw);
        height: auto;
        object-fit: contain;
      }

      .typing-copy {
        margin: 0;
        min-height: 4.8em;
        max-width: 36rem;
        width: min(36rem, 88vw);
        font-size: clamp(1.05rem, 1.8vw, 1.35rem);
        line-height: 1.9;
        letter-spacing: 0.03em;
        color: rgba(255, 255, 255, 0.88);
      }

      .typing-thanks {
        margin: 0;
        min-height: 2.2em;
        max-width: 32rem;
        font-size: clamp(1.7rem, 3.6vw, 2.6rem);
        line-height: 1.35;
        letter-spacing: 0.05em;
        font-weight: 700;
        color: #ffffff;
        opacity: 0;
        transform: translateY(18px) scale(0.96);
      }

      .typing-thanks.is-visible {
        animation: thanks-rise 0.7s cubic-bezier(0.2, 0.9, 0.2, 1) forwards, thanks-glow 2.6s ease-in-out 0.7s infinite;
      }

      .typing-caret {
        display: inline-block;
        width: 0.08em;
        height: 0.9em;
        margin-left: 0.14em;
        background: currentColor;
        vertical-align: -0.08em;
        animation: typing-caret-blink 0.9s steps(1, end) infinite;
      }

      @keyframes typing-caret-blink {
        0%, 49% {
          opacity: 1;
        }

        50%, 100% {
          opacity: 0;
        }
      }

      @keyframes thanks-rise {
        from {
          opacity: 0;
          transform: translateY(18px) scale(0.96);
        }

        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      @keyframes thanks-glow {
        0%, 100% {
          text-shadow: 0 0 0 rgba(255, 255, 255, 0);
        }

        50% {
          text-shadow: 0 0 18px rgba(255, 255, 255, 0.28);
        }
      }
    </style>
  </head>
  <body class="story-page story-typing-page" data-page-id="story-ending" data-page-title="故事完結">
    <div class="story-shell">
      <section class="story-plain" aria-label="Ending page">
        <h1 class="typing-line" id="typingLine" aria-live="polite"></h1>
        <p class="typing-copy" id="typingCopy" aria-live="polite"></p>
        <p class="typing-thanks" id="typingThanks" aria-live="polite"></p>
      </section>
    </div>
    <script src="./assets/js/story-transition.js"></script>
    <script>
      (function () {
        var lineNode = document.getElementById('typingLine');
        var copyNode = document.getElementById('typingCopy');
        var thanksNode = document.getElementById('typingThanks');
        var storyTransition = window.HSBCStoryTransition;
        var lineImagePath = './assets/media/icons/chiikawa_icon.png';
        var copyText = '由創業起步、成功開戶，到管理匯率風險及規劃拓展，小白終於有更多時間專注做好生意，也對未來更有把握。';
        var thanksText = '「多謝你，滙豐萬事屋」';

        function renderCopy() {
          var copyParts;

          if (!storyTransition) {
            return;
          }

          copyParts = storyTransition.ensureLineStructure(copyNode, 'typing-caret');
          storyTransition.typeCharacters(copyParts.textNode, copyText, 34, function () {
            thanksNode.classList.add('is-visible');
            storyTransition.typeCharacters(thanksNode, thanksText, 48);
          });
        }

        function renderLine() {
          lineNode.innerHTML = '<img class="typing-line-image" src="' + lineImagePath + '" alt="Chiikawa" />';
          window.setTimeout(renderCopy, 220);
        }

        renderLine();
      }());
    </script>
    <script defer src="./assets/js/presenter-display.js"></script>
  </body>
</html>
