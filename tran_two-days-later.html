<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>兩天後</title>
    <link rel="stylesheet" href="./assets/css/styles.css" />
    <style>
      .story-transition-page .story-shell {
        min-height: 100vh;
      }

      .transition-plain {
        display: flex;
        min-height: 100vh;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 32px;
        padding: 48px 24px;
      }

      .transition-line {
        margin: 0;
        min-height: 3.8em;
        max-width: 16em;
        text-align: center;
        font-size: clamp(2rem, 4.5vw, 3.5rem);
        line-height: 1.75;
        letter-spacing: 0.06em;
        font-weight: 500;
        color: inherit;
        text-wrap: balance;
      }

      .transition-caret {
        display: inline-block;
        width: 0.08em;
        height: 0.9em;
        margin-left: 0.14em;
        background: currentColor;
        vertical-align: -0.08em;
        animation: transition-caret-blink 0.9s steps(1, end) infinite;
      }

      .message-bubble {
        position: relative;
        display: none;
        align-items: center;
        gap: 16px;
        padding: 22px 28px;
        border: 0;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.97);
        box-shadow: 0 24px 80px rgba(112, 72, 40, 0.18);
        transform: translateY(16px) scale(0.96);
        opacity: 0;
        cursor: pointer;
      }

      .message-bubble.is-visible {
        display: inline-flex;
        animation: bubble-rise 0.65s cubic-bezier(0.2, 0.9, 0.2, 1) forwards;
      }

      .message-bubble::before,
      .message-bubble::after {
        content: "";
        position: absolute;
        background: rgba(255, 255, 255, 0.97);
        border-radius: 50%;
        box-shadow: 0 12px 36px rgba(112, 72, 40, 0.12);
      }

      .message-bubble::before {
        width: 28px;
        height: 28px;
        left: 18%;
        bottom: -18px;
      }

      .message-bubble::after {
        width: 16px;
        height: 16px;
        left: 13%;
        bottom: -34px;
      }

      .message-logo {
        width: 52px;
        height: 52px;
        object-fit: contain;
        flex: 0 0 auto;
      }

      .message-copy {
        margin: 0;
        min-height: 1.6em;
        font-size: clamp(1.2rem, 2.4vw, 1.6rem);
        line-height: 1.4;
        color: #db0011;
        font-weight: 600;
        letter-spacing: 0.04em;
      }

      @keyframes transition-caret-blink {
        0%, 49% {
          opacity: 1;
        }

        50%, 100% {
          opacity: 0;
        }
      }

      @keyframes bubble-rise {
        from {
          opacity: 0;
          transform: translateY(16px) scale(0.96);
        }

        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }
    </style>
  </head>
  <body class="story-page story-page-transition" data-page-id="story-two-days-later" data-page-title="兩天後">
    <div class="story-shell story-shell-centered">
      <section class="story-plain transition-plain" aria-label="Two days later transition">
        <h1 class="transition-line" id="transitionLine" aria-live="polite"></h1>
        <button class="message-bubble" id="messageBubble" type="button" aria-label="你有一則新訊息" aria-live="polite">
          <img class="message-logo" src="./assets/media/icons/hsbc_logo.png" alt="HSBC Logo" />
          <p class="message-copy" id="messageCopy"></p>
        </button>
      </section>
    </div>
    <script>
      (function () {
        var lineNode = document.getElementById('transitionLine');
        var bubbleNode = document.getElementById('messageBubble');
        var bubbleCopyNode = document.getElementById('messageCopy');
        var lineText = '兩天後。。。';
        var bubbleText = '你有一則新訊息';
        var lineIndex = 0;
        var bubbleIndex = 0;
        var lineReady = false;
        var bubbleShown = false;

        function renderLine() {
          if (lineIndex < lineText.length) {
            lineNode.textContent += lineText.charAt(lineIndex);
            lineIndex += 1;
            window.setTimeout(renderLine, 90);
            return;
          }

          lineReady = true;
          lineNode.innerHTML = lineNode.textContent + '<span class="transition-caret" aria-hidden="true"></span>';
        }

        function renderBubbleText() {
          if (bubbleIndex >= bubbleText.length) {
            return;
          }

          bubbleCopyNode.textContent += bubbleText.charAt(bubbleIndex);
          bubbleIndex += 1;
          window.setTimeout(renderBubbleText, 85);
        }

        function revealBubble() {
          if (!lineReady || bubbleShown) {
            return;
          }

          bubbleShown = true;
          bubbleNode.classList.add('is-visible');
          renderBubbleText();
        }

        document.addEventListener('click', function (event) {
          if (bubbleShown && bubbleNode.contains(event.target)) {
            return;
          }

          revealBubble();
        });

        document.addEventListener('keydown', function (event) {
          if (event.key === 'Enter' || event.key === ' ') {
            if (bubbleShown && document.activeElement === bubbleNode) {
              return;
            }

            revealBubble();
          }
        });

        bubbleNode.addEventListener('click', function () {
          if (!bubbleShown) {
            return;
          }

          window.location.href = './loks_account-opening.html';
        });

        renderLine();
      }());
    </script>
    <script defer src="./assets/js/presenter-display.js"></script>
  </body>
</html>
