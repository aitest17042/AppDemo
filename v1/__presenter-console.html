<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>滙豐萬事屋 Presenter Console</title>
    <link rel="stylesheet" href="./assets/css/styles.css" />
  </head>
  <body class="presenter-console-page" data-page-id="presenter-console">
    <div class="presenter-console-shell">
      <header class="presenter-console-header">
        <div>
          <p class="presenter-console-kicker">Presenter Console</p>
          <h1>展示控制台</h1>
          <p class="presenter-console-copy">在此頁面切換展示畫面，並向聊天 demo 頁直接發送 demo inputs。展示頁面本身不再顯示 navigation tab。</p>
        </div>
        <div class="presenter-console-status" id="presenterConsoleStatus">未連接展示頁</div>
      </header>

      <main class="presenter-console-main" id="presenterConsoleApp"></main>
    </div>

    <aside class="presenter-console-floating" aria-label="Presenter status floating panel">
      <section class="presenter-console-floating-section">
        <div class="presenter-console-floating-heading-row">
          <p class="presenter-console-floating-kicker">Now Showing</p>
          <div class="presenter-console-floating-nav">
            <button class="presenter-console-floating-nav-btn" id="presenterConsolePrevStep" type="button" aria-label="上一頁">&lt;</button>
            <button class="presenter-console-floating-nav-btn" id="presenterConsoleNextStep" type="button" aria-label="下一頁">&gt;</button>
          </div>
        </div>
        <strong id="presenterConsoleFloatingPage">未收到展示頁</strong>
        <div class="presenter-console-floating-step" id="presenterConsoleFloatingStep">Step - / -</div>
        <p class="presenter-console-floating-copy" id="presenterConsoleFloatingSummary">等待展示頁回報目前頁面。</p>
        <p class="presenter-console-floating-detail" id="presenterConsoleFloatingDetail">目前未提供進一步聊天狀態。</p>
      </section>

      <section class="presenter-console-floating-section">
        <div class="presenter-console-floating-timer-row">
          <p class="presenter-console-floating-kicker">Timer</p>
          <div class="presenter-console-floating-timer-actions">
            <button class="presenter-console-floating-reset" id="presenterConsoleTimerToggle" type="button">Stop</button>
            <button class="presenter-console-floating-reset" id="presenterConsoleTimerReset" type="button">Reset</button>
          </div>
        </div>
        <div class="presenter-console-floating-timer" id="presenterConsoleTimer">00:00</div>
      </section>

      <section class="presenter-console-floating-section">
        <p class="presenter-console-floating-kicker">Quick Jump</p>
        <ol class="presenter-console-floating-sequence" id="presenterConsoleSequenceList"></ol>
      </section>
    </aside>

    <script defer src="./assets/js/flow-account-opening-start.js"></script>
    <script defer src="./assets/js/flow-account-opening-complete.js"></script>
    <script defer src="./assets/js/flow-fx-hedging.js"></script>
    <script defer src="./assets/js/flow-mainland-branch.js"></script>
    <script defer src="./assets/js/knowledgeBase.js"></script>
    <script defer src="./assets/js/presenter-console.js"></script>
  </body>
</html>
