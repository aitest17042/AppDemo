<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>滙豐萬事屋</title>
    <link rel="stylesheet" href="./assets/css/styles.css" />
  </head>
  <body data-page-id="assistant-mainland-branch" data-default-topic="拓展內地分店" data-default-topic-id="mainland-branch-flow" data-initial-entry="assistant-mainland-branch">
    <div class="workspace-layout" id="workspaceLayout">
      <div class="app-shell">
        <div class="phone-frame">
          <div class="phone-screen">
            <div class="status-bar">
              <div id="statusTime">--:--</div>
              <div class="status-icons">
                <span class="icon" aria-hidden="true">
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M18 10a6 6 0 1 0-12 0"></path>
                    <path d="M14.31 6.47a3 3 0 0 0-4.62 0"></path>
                    <path d="M13 10a1 1 0 0 0-2 0"></path>
                  </svg>
                </span>
                <span class="icon" aria-hidden="true">
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 20h.01"></path>
                    <path d="M2 8.82a15 15 0 0 1 20 0"></path>
                    <path d="M5 12.86a10 10 0 0 1 14 0"></path>
                    <path d="M8.5 16.43a5 5 0 0 1 7 0"></path>
                  </svg>
                </span>
                <span class="battery-group">
                  <span class="battery-level">85</span>
                  <span class="icon" aria-hidden="true">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                      <rect x="2" y="7" width="18" height="10" rx="2"></rect>
                      <path d="M22 11v2"></path>
                    </svg>
                  </span>
                </span>
              </div>
            </div>

            <div class="dynamic-island" aria-hidden="true"></div>

            <header class="header">
              <img class="app-logo" src="./assets/media/icons/hsbc_logo.png" alt="滙豐萬事屋" />
              <div class="header-copy">
                <h1><span class="app-name-with-status">滙豐萬事屋<span class="online-indicator" aria-label="在線"></span></span></h1>
              </div>
              <div class="header-actions">
                <div class="header-user" aria-label="已登入用戶">
                  <img class="header-user-avatar" src="./assets/media/icons/chiikawa_icon.png" alt="已登入用戶" />
                  <span class="header-user-verified" aria-hidden="true">
                    <svg width="8" height="8" viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg">
                      <path d="M2.5 6.2 4.8 8.4 9.5 3.7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                  </span>
                </div>
              </div>
            </header>

            <main class="chat-area" id="chatArea">
              <div class="timeline-label" id="timelineLabel">今天 --:-- --</div>
              <div class="message-list" id="messageList"></div>
            </main>

            <footer class="composer">
              <input id="fileUploadInput" class="composer-file-input" type="file" hidden />
              <button id="uploadButton" class="upload-button" type="button" aria-label="Upload supporting files" hidden>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M21.44 11.05 12.25 20.24a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 1 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.82-2.82l8.48-8.48"></path>
                </svg>
              </button>
              <div class="composer-input">
                <input id="messageInput" type="text" placeholder="請輸入您的問題..." autocomplete="off" />
              </div>
              <button id="sendButton" class="send-button" type="button" aria-label="Send message">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="m22 2-7 20-4-9-9-4Z"></path>
                  <path d="M22 2 11 13"></path>
                </svg>
              </button>
            </footer>

            <div class="home-indicator"><div></div></div>
          </div>
        </div>
      </div>
    </div>
    <script defer src="./assets/js/account-opening-flow.js"></script>
    <script defer src="./assets/js/fx-hedging-flow.js"></script>
    <script defer src="./assets/js/mainland-branch-flow.js"></script>
    <script defer src="./assets/js/knowledgeBase.js"></script>
    <script defer src="./assets/js/app.js"></script>
  </body>
</html>
